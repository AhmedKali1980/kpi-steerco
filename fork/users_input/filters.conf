# W02 filters. Format: FILTER_NAME=value1;value2;value3
# FILTER_INCLUDE_* keeps only rows whose target column matches one of the values.
# FILTER_EXCLUDE_* excludes rows whose target column matches one of the values.
# Values may be wrapped in quotes when they contain spaces. Empty values disable the corresponding filter.
FILTER_EXCLUDE_CLOUDTYPE=
FILTER_INCLUDE_OSNAME=
FILTER_EXCLUDE_MAINAPP=
FILTER_EXCLUDE_TYPOLOGY=
FILTER_EXCLUDE_DOMAIN=
FILTER_EXCLUDE_SERVICEOFFER=
FILTER_INCLUDE_SERVERSTATUS=
FILTER_INCLUDE_DALISTATUS=
FILTER_INCLUDE_DALIUSAGE=
FILTER_EXCLUDE_OWNERACCOUNT=
FILTER_EXCLUDE_BENEFICIARYACCOUNT=
