# key,value custom filters
program,REGULATORY_A
network,DMZ
# Exclude any server whose INV_Beneficiary_Account matches one of these values (comma-separated).
FILTER_BENEFICIARY_ACCOUNT_NOT_TAKEN=
FILTER_OWNER_ACCOUNT_NOT_TAKEN=
# Exclude Marley/inventory enrichment for these owner accounts (comma-separated).
FILTER_OWNER_ACCOUNTS_NOT_TO_ENRICH=
# Keep only rows where server.status exactly matches one of these values (comma-separated).
FILTER_SERVER_STATUS=
# Environment filter for PROD scoping. Example: PRD,DRP,BCK
# Special value: all  -> disables environment filtering and keeps all environments.
FILTER_PRD_ENV=PRD,DRP,BCK
# Exclude rows where DNS NAME contains one of these domain tokens (comma-separated).
FILTER_DOMAIN_NOT_TAKEN=
FILTER_TAKE_ONLY_KEARS_IN_SCOPE_FROM_MARLEY=TRUE

# Exclude rows where DALI [CI] SERVICE OFFER starts with one of these values (comma-separated).
F_EXCLUDE_SERVICE_OFFER=

# INTERNET.EXPOSED scope filters (comma-separated values, case-insensitive).
# INCLUDE_* filters keep rows matching configured values; EXCLUDE_* filters remove rows containing configured values.
F_INTEXP.INCLUDE_server_os_name=
F_INTEXP.INCLUDE_server_cloud_type=
F_INTEXP.EXCLUDE_application_dali_dsi=
F_INTEXP.EXCLUDE_application_uid=
F_INTEXP.INCLUDE_server_status=
F_INTEXP.EXCLUDE_server_typology=
F_INTEXP.INCLUDE_server_environment=
F_INTEXP.EXCLUDE_server_silo=
